<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard principal</title>

    <!-- Preset de CSS Bed -->
    <link rel="stylesheet" href="https://unpkg.com/@picocss/pico@latest/css/pico.classless.min.css" type="text/css">

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header>
        <section id="logo">
            <div class="logo-container">
                <img src="img/burger-logo.png" class="logo" alt="Los pollos hermanos">
            </div>

            <h2 class="logo-titulo">Las vacas hermanas</h2>
        </section>

        <nav>
            <ul class="lista-nav">
                <li>
                    <a href="index.html">
                        Principal
                    </a>
                </li>
                <li>
                    <a href="get.html">
                        Obtener
                    </a>
                </li>
                <li>
                    <a href="post.html">
                        Crear
                    </a>
                </li>
                <li>
                    <a href="put.html">
                        Modificar
                    </a>
                </li>
                <li>
                    <a href="delete.html">
                        Eliminar
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="getIdProduct-container">

            <!-- Formulario GET product by id -->
            <form id="getIdProductForm">

                <label for="idProd">Id del producto</label>
                <input type="number" name="idProd" id="idProd" required>

                <input type="submit" value="Consultar producto">
            </form>

        </section>

        <section id="contenedor-productos"></section>
    </main>

    <script>
        const contenedorProductos = document.getElementById("contenedor-productos");
        const getIdProductForm = document.getElementById("getIdProductForm");
        const urlBase = "http://localhost:3000";

        getIdProductForm.addEventListener("submit", async event => {

            // Evitamos el envio por defecto del <form>
            event.preventDefault();

            // Extraemos el valor del campo id 
            const idProd = event.target.idProd.value.trim();
            // console.log(idProd);

            try {
                const response = await fetch(`${urlBase}/api/products/${idProd}`);
                console.log(response);

                const data = await response.json();
                const producto = data.payload[0];

                renderizarProducto(producto);

            } catch (error) {
                console.error("Error al obtener producto: ", error.message);
            }
        });


        function renderizarProducto(producto) {
            console.table(producto);

            let htmlProducto = `
                <ul class="lista-container">
                    <li class="lista-producto">
                        <img src="${producto.image}" alt="${producto.name}" class="lista-producto_img">
                        <p>Id: ${producto.id} / Nombre: ${producto.name} / <strong>Precio: $${producto.price}</strong></p>
                        <p><button id="deleteProduct-button">Eliminar producto</button></p>
                    </li>
                </ul>
            `;

            contenedorProductos.innerHTML = htmlProducto;

            const deleteProductButton = document.getElementById("deleteProduct-button");

            deleteProductButton.addEventListener("click", event => {

                // Evitamos la propagacion de eventos con respecto al evento de preventDefault
                // event.stopPropagation(); 

                const confirmacion = confirm("Queres eliminar este producto?");

                if(!confirmacion) {
                    alert("Eliminacion cancelada")
                } else {
                    eliminarProducto(producto.id);
                }
            });
        }

        async function eliminarProducto(id) {
            console.log(id); // El id llega correctamente a la funcion

            try {
                const response = await fetch(`${urlBase}/api/products/${id}`, {
                    method: "DELETE"
                });

                console.log(response);

                const result = await response.json();
                console.log(result);

                console.log(result.message);
                alert(result.message);

                // Limpiamos la pantalla (borramos el listado del producto que recien eliminamos)
                contenedorProductos.innerHTML = "";



            } catch (error) {
                console.error("Error en la solicitud DELETE: ", error);
                alert("Ocurrio un error al eliminar un producto")
            }
        }

    </script>
</body>

</html>
